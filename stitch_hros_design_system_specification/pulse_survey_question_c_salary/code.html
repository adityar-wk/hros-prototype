<script>
        // Simple micro-interaction for option selection
        document.querySelectorAll('button.group').forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset others
                document.querySelectorAll('button.group').forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    b.querySelector('span').classList.remove('text-on-primary');
                    b.querySelector('span').classList.add('text-on-surface');
                });
                
                // Select current
                this.classList.add('bg-primary', 'border-primary');
                this.querySelector('span').classList.remove('text-on-surface');
                this.querySelector('span').classList.add('text-on-primary');
                
                // Haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
