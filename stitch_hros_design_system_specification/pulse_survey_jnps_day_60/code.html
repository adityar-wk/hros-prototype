<script>
        function selectNps(value) {
            const tiles = document.querySelectorAll('.nps-tile');
            tiles.forEach(tile => {
                if (parseInt(tile.getAttribute('data-value')) === value) {
                    tile.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                    tile.classList.remove('border-outline-variant', 'hover:bg-surface-container-low');
                } else {
                    tile.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    tile.classList.add('border-outline-variant', 'hover:bg-surface-container-low');
                }
            });
        }
    </script>
