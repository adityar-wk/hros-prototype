<body class="bg-background text-on-surface">
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b border-surface-variant h-touch-target-min flex items-center justify-between px-mobile-margin max-w-md mx-auto left-1/2 -translate-x-1/2">
<div class="flex items-center gap-md">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min text-primary active:opacity-80 transition-opacity" onclick="window.location.href='../family_nominees_nominee_selection/code.html'">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Family &amp; Nominees</h1>
</div>
</header>
<main class="pt-huge pb-xxl px-mobile-margin max-w-md mx-auto min-h-screen">
<div class="mt-lg mb-xl">
<h2 class="font-body-md-bold text-body-md-bold text-on-surface mb-xs flex items-center gap-xs">
                Member Information
                <span class="w-3 h-3 rounded-full bg-tertiary-container animate-pulse"></span>
</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Complete the details below to add your nominee to the enterprise benefits system.</p>
</div>
<form class="space-y-lg" id="addMemberForm">
<div class="space-y-xs">
<label class="font-label-sm-bold text-label-sm-bold text-on-surface-variant block ml-1">Full Name</label>
<div class="relative group">
<input class="w-full h-touch-target-min px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant outline-none" placeholder="Legal name as per Aadhaar" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm-bold text-label-sm-bold text-on-surface-variant block ml-1">Date of Birth</label>
<div class="relative">
<input class="w-full h-touch-target-min px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" id="dobInput" type="date"/>
</div>
<div class="hidden animate-in fade-in slide-in-from-top-2 duration-300" id="minorNotice">
<div class="mt-sm p-sm bg-secondary-container bg-opacity-30 border border-secondary-container rounded-lg flex gap-sm items-start">
<span class="material-symbols-outlined text-secondary text-[20px]">info</span>
<p class="font-label-sm text-label-sm text-on-secondary-container">Adding a minor requires parental/guardian consent verification.</p>
</div>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm-bold text-label-sm-bold text-on-surface-variant block ml-1">Relationship</label>
<div class="relative">
<select class="w-full h-touch-target-min px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" id="relationshipSelect">
<option disabled="" selected="" value="">Select relationship</option>
<option value="spouse">Spouse</option>
<option value="child">Child</option>
<option value="parent">Parent</option>
<option value="sibling">Sibling</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="hidden space-y-xs animate-in fade-in slide-in-from-top-2 duration-300" id="employmentSection">
<label class="font-label-sm-bold text-label-sm-bold text-on-surface-variant block ml-1">Employment Status</label>
<div class="grid grid-cols-2 gap-sm">
<button class="employment-btn h-touch-target-min flex items-center justify-center border border-outline-variant rounded-lg font-label-sm-bold text-label-sm-bold hover:bg-surface-container transition-colors active:scale-95" data-status="salaried" type="button">Salaried</button>
<button class="employment-btn h-touch-target-min flex items-center justify-center border border-outline-variant rounded-lg font-label-sm-bold text-label-sm-bold hover:bg-surface-container transition-colors active:scale-95" data-status="others" type="button">Self/Others</button>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm-bold text-label-sm-bold text-on-surface-variant block ml-1">Aadhaar (Optional)</label>
<div class="relative group">
<input class="w-full h-touch-target-min px-md rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant outline-none" maxlength="12" placeholder="12-digit UID number" type="text"/>
</div>
</div>
<div class="p-lg bg-surface-container-low border border-outline-variant rounded-xl mt-xxl">
<div class="flex gap-md">
<div class="pt-1">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" id="consent" type="checkbox"/>
</div>
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block leading-relaxed" for="consent">
                            We use your family details to set up insurance, PF, and gratuity nominations. This data is not shared beyond these statutory purposes.
                        </label>
<p class="font-label-sm-bold text-label-sm-bold text-primary underline">DPDP Policy &amp; Terms</p>
</div>
</div>
</div>
</form>
</main>
<div class="fixed bottom-0 left-0 w-full p-lg bg-surface border-t border-surface-variant max-w-md mx-auto left-1/2 -translate-x-1/2 z-50">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-body-md-bold text-body-md-bold rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" onclick="window.location.href='../family_nominees_nomination_summary/code.html'">
            Add Member
            <span class="material-symbols-outlined text-[18px]">person_add</span>
</button>
</div>
<script>
        document.getElementById('dobInput').addEventListener('change', function(e) {
            const birthDate = new Date(e.target.value);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            const minorNotice = document.getElementById('minorNotice');
            if (age < 18) {
                minorNotice.classList.remove('hidden');
            } else {
                minorNotice.classList.add('hidden');
            }
        });

        document.getElementById('relationshipSelect').addEventListener('change', function(e) {
            const employmentSection = document.getElementById('employmentSection');
            if (e.target.value === 'spouse') {
                employmentSection.classList.remove('hidden');
            } else {
                employmentSection.classList.add('hidden');
            }
        });

        const empButtons = document.querySelectorAll('.employment-btn');
        empButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                empButtons.forEach(b => b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary'));
                btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
            });
        });
    </script>
