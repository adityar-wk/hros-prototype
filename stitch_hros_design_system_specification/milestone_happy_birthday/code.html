<script>
        let isShared = false;
        function toggleSwitch() {
            isShared = !isShared;
            const toggle = document.getElementById('share-toggle');
            const handle = document.getElementById('switch-handle');
            
            if (isShared) {
                toggle.classList.remove('bg-outline-variant');
                toggle.classList.add('bg-primary-container');
                handle.classList.add('translate-x-5');
                handle.classList.remove('translate-x-0');
            } else {
                toggle.classList.add('bg-outline-variant');
                toggle.classList.remove('bg-primary-container');
                handle.classList.remove('translate-x-5');
                handle.classList.add('translate-x-0');
            }
        }

        // Simple entrance animation for elements
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-in');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
