<script>
        function selectRating(num) {
            // Reset all
            for (let i = 1; i <= 5; i++) {
                const el = document.getElementById('rate-' + i);
                el.classList.remove('bg-primary-container', 'text-on-primary-container', 'ring-2', 'ring-primary-container', 'ring-offset-2');
                el.classList.add('border', 'border-outline-variant');
            }
            // Select new
            const activeEl = document.getElementById('rate-' + num);
            activeEl.classList.remove('border', 'border-outline-variant');
            activeEl.classList.add('bg-primary-container', 'text-on-primary-container', 'ring-2', 'ring-primary-container', 'ring-offset-2');
            
            // Haptic-like feedback animation
            activeEl.classList.add('scale-active');
            setTimeout(() => activeEl.classList.remove('scale-active'), 100);
        }
    </script>
