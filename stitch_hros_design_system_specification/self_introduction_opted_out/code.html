        // Simple micro-interaction for the primary button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            this.innerHTML = 'Redirecting...';
            setTimeout(() => {
                this.innerHTML = 'Return to Tasks';
            }, 1000);
        });

        // Add a subtle entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transform = 'translateY(10px)';
            main.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            setTimeout(() => {
                main.style.opacity = '1';
                main.style.transform = 'translateY(0)';
            }, 100);
        });
