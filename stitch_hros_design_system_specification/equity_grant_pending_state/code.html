<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface flex items-center w-full px-mobile-margin h-touch-target-min docked full-width top-0 border-b border-outline-variant transition-colors duration-200 z-50 sticky">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors duration-200 active:opacity-70 rounded-full p-2" onclick="window.location.href='../journey_map_current_stage_expanded/code.html'">arrow_back</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Equity Grant</h1>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 px-mobile-margin py-xl flex flex-col items-center justify-center text-center">
<!-- Radical Reduction Empty State Graphic -->
<div class="mb-xl relative group">
<div class="w-48 h-48 rounded-full bg-surface-container flex items-center justify-center hairline-border transition-all duration-500 group-hover:scale-[1.02]">
<!-- Geometric Minimal Illustration -->
<div class="relative w-24 h-24">
<div class="absolute inset-0 border-2 border-primary rounded-xl opacity-20 transform -rotate-12 animate-pulse"></div>
<div class="absolute inset-2 border-2 border-primary rounded-lg opacity-40 transform rotate-6"></div>
<div class="absolute inset-4 bg-primary rounded shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-surface text-[40px]" style="font-variation-settings: 'FILL' 1;">update</span>
</div>
</div>
</div>
<!-- Readiness Signal (Amber - Action Needed/Pending) -->
<div class="absolute top-2 right-2 w-4 h-4 bg-amber-500 rounded-full border-4 border-background"></div>
</div>
<!-- Main Message -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-md max-w-[280px] mx-auto">
            Grant terms pending
        </h2>
<p class="font-body-md text-on-surface-variant mb-xl max-w-[300px]">
            Your equity grant terms will be shared within 4 weeks of joining. This screen will update when ready.
        </p>
<!-- Explanation Card (Task Card Style) -->
<div class="w-full bg-surface-container-lowest hairline-border p-md rounded-lg text-left max-w-sm mb-huge">
<div class="flex items-start gap-md">
<div class="mt-1">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">info</span>
</div>
<div>
<span class="font-label-sm-bold text-label-sm-bold text-on-surface-variant block mb-base">Current Status</span>
<p class="font-body-md text-on-surface">Awaiting board approval for current quarter grants.</p>
</div>
</div>
</div>

<button class="fixed bottom-24 right-mobile-margin w-touch-target-min h-touch-target-min bg-primary text-on-primary rounded-full flex items-center justify-center ambient-shadow z-40 transition-transform active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
</button>

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">assignment</span>

<span class="font-label-sm text-label-sm">Concierge</span>
</button>
</nav>
<script>
        // Micro-interaction: Subtle parallax on the illustration
        document.addEventListener('mousemove', (e) => {
            const illustration = document.querySelector('.group');
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            illustration.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
