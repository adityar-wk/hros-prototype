<script>
    function handleOpenJourney() {
      const main = document.querySelector('main');
      main.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
      main.style.opacity = '0';
      main.style.transform = 'scale(1.05)';
      setTimeout(() => {
        window.location.href = '../acceptance_confirmation_moment_2/code.html';
      }, 800);
    }

    // Interactive hover parallax for background
    document.addEventListener('mousemove', (e) => {
      const img = document.querySelector('img');
      const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
      img.style.transform = `scale(1.1) translate(${xAxis}px, ${yAxis}px)`;
    });
  </script>
