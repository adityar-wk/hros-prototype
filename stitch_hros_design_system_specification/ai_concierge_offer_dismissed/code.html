<script>
        // Micro-interaction for input focus
        const chatInput = document.querySelector('input');
        const inputContainer = chatInput.parentElement;

        chatInput.addEventListener('focus', () => {
            inputContainer.classList.add('border-primary');
            inputContainer.classList.remove('border-outline-variant');
        });

        chatInput.addEventListener('blur', () => {
            inputContainer.classList.remove('border-primary');
            inputContainer.classList.add('border-outline-variant');
        });

        // Simple haptic-like scale effect on all buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
