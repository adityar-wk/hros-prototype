<script>
        function calculateSavings(val) {
            const feedback = document.getElementById('hra-feedback');
            const savingsVal = document.getElementById('savings-val');
            const projectedTds = document.getElementById('projected-tds');
            
            const rent = parseFloat(val) || 0;
            
            if (rent > 0) {
                feedback.classList.remove('hidden');
                // Dummy calculation for visual feedback
                const savings = Math.min(1850, Math.floor(rent * 0.1));
                savingsVal.innerText = '₹' + savings.toLocaleString();
                
                const currentTds = 12450 - savings;
                projectedTds.innerText = '₹' + currentTds.toLocaleString();
            } else {
                feedback.classList.add('hidden');
                projectedTds.innerText = '₹12,450';
            }
        }
    </script>
