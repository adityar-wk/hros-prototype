<script>
        let selected = null;

        function selectRegime(type) {
            selected = type;
            
            // Reset styles
            document.getElementById('card-old').classList.remove('active-ring', 'bg-primary-container', 'text-on-primary-container');
            document.getElementById('card-new').classList.remove('active-ring', 'bg-primary-container', 'text-on-primary-container');
            document.getElementById('check-old').classList.add('opacity-0');
            document.getElementById('check-new').classList.add('opacity-0');

            // Set active
            const activeCard = document.getElementById('card-' + type);
            activeCard.classList.add('active-ring');
            document.getElementById('check-' + type).classList.remove('opacity-0');
            document.getElementById('check-' + type).classList.add('opacity-100');

            // Show declaration bar
            const bar = document.getElementById('declaration-bar');
            const text = document.getElementById('selected-regime-text');
            text.textContent = type.toUpperCase();
            bar.classList.remove('translate-y-full');
        }

        document.getElementById('consent').addEventListener('change', (e) => {
            const btn = document.getElementById('confirm-btn');
            btn.disabled = !e.target.checked;
        });

        document.getElementById('confirm-btn').addEventListener('click', () => {
            alert('Selection Confirmed: ' + (selected === 'new' ? 'New Regime' : 'Old Regime'));
        });
    </script>
