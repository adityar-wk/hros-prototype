<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HROS · Prototype Navigator</title>
<style>
  :root {
    --sidebar-w: 280px;
    --topbar-h: 52px;
    --phone-w: 390px;
    --phone-h: 844px;
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --accent: #6366f1;
    --accent-dim: rgba(99,102,241,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  #topbar {
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
  }
  #topbar .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #topbar .logo span {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.3px;
  }
  #topbar .sep { color: var(--border); margin: 0 4px; }
  #screen-title {
    flex: 1;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #screen-title strong { color: var(--text); }
  #topbar .counter {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  #search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  #search-wrap svg {
    position: absolute;
    left: 9px;
    color: var(--text-muted);
    width: 14px; height: 14px;
    pointer-events: none;
  }
  #search {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 5px 10px 5px 30px;
    border-radius: 6px;
    width: 180px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }

  /* ── Main layout ── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding-bottom: 24px;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 6px;
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .section-header:hover { background: var(--surface2); }
  .section-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-name {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    flex: 1;
  }
  .section-count {
    font-size: 10px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 10px;
  }
  .section-chevron {
    color: var(--text-muted);
    font-size: 10px;
    transition: transform 0.2s;
  }
  .section-chevron.open { transform: rotate(90deg); }

  .section-screens {
    display: none;
  }
  .section-screens.open { display: block; }

  .screen-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 30px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 0;
    transition: background 0.1s, color 0.1s;
    line-height: 1.4;
  }
  .screen-item:hover {
    background: var(--surface2);
    color: var(--text);
  }
  .screen-item.active {
    background: var(--accent-dim);
    color: #a5b4fc;
    font-weight: 500;
  }
  .screen-item.active .screen-num { color: var(--accent); }
  .screen-num {
    font-size: 10px;
    color: var(--border);
    width: 18px;
    flex-shrink: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .screen-name { flex: 1; }

  /* Divider between sidebar sections */
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 14px;
  }

  /* ── Center stage ── */
  #center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  /* Phone frame */
  #phone-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #phone-frame {
    width: var(--phone-w);
    height: var(--phone-h);
    border-radius: 50px;
    background: #1c1c1e;
    box-shadow:
      0 0 0 2px #3a3a3c,
      0 0 0 8px #1c1c1e,
      0 0 0 10px #3a3a3c,
      0 50px 100px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  /* Side buttons */
  #phone-frame::before {
    content: '';
    position: absolute;
    right: -12px;
    top: 120px;
    width: 4px;
    height: 70px;
    background: #3a3a3c;
    border-radius: 2px;
    z-index: 10;
  }
  .phone-btn-left {
    position: absolute;
    left: -12px;
    background: #3a3a3c;
    border-radius: 2px;
    z-index: 10;
  }
  .btn-l1 { top: 100px; width: 4px; height: 40px; }
  .btn-l2 { top: 155px; width: 4px; height: 60px; }
  .btn-l3 { top: 225px; width: 4px; height: 60px; }

  #phone-inner {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 48px;
    overflow: hidden;
    background: #fff;
  }
  /* Notch */
  #phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #1c1c1e;
    border-radius: 0 0 20px 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #phone-notch .camera {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
  }
  #phone-notch .speaker {
    width: 40px; height: 4px;
    background: #0a0a0a;
    border-radius: 2px;
  }
  /* Home indicator */
  #phone-home {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 5px;
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
    z-index: 20;
  }
  #phone-iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 48px;
  }

  /* ── Bottom nav bar ── */
  #bottombar {
    height: 56px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .nav-btn:hover:not(:disabled) {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #a5b4fc;
  }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .nav-btn svg { width: 14px; height: 14px; }

  #progress-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
  }
  #progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  #open-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s;
  }
  #open-btn:hover { background: var(--surface); color: var(--text); }
  #open-btn svg { width: 13px; height: 13px; }

  /* Scale phone to fit viewport */
  #scale-wrap {
    transform-origin: center center;
  }

  /* Search highlight */
  .screen-item.search-hidden { display: none; }
  .section-group.search-empty { display: none; }

  /* Loading overlay */
  #loading {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.9);
    border-radius: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #loading.visible { opacity: 1; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Keyboard hint */
  #kbd-hint {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: inherit;
    color: var(--text-muted);
  }
</style>
</head>

// ─────────────────────────────────────────────
// Build flat index
// ─────────────────────────────────────────────
const ALL_SCREENS = [];
FLOW.forEach(section => {
  section.screens.forEach(screen => {
    ALL_SCREENS.push({ ...screen, sectionId: section.id, sectionLabel: section.label, sectionColor: section.color });
  });
});

let currentIndex = -1;

// ─────────────────────────────────────────────
// DOM refs
// ─────────────────────────────────────────────
const sidebar       = document.getElementById('sidebar');
const iframe        = document.getElementById('phone-iframe');
const loading       = document.getElementById('loading');
const prevBtn       = document.getElementById('prev-btn');
const nextBtn       = document.getElementById('next-btn');
const screenTitle   = document.getElementById('screen-title');
const flowLabel     = document.getElementById('flow-label');
const posLabel      = document.getElementById('pos-label');
const progressFill  = document.getElementById('progress-fill');
const totalCounter  = document.getElementById('total-counter');
const searchInput   = document.getElementById('search');
const openBtn       = document.getElementById('open-btn');
const scaleWrap     = document.getElementById('scale-wrap');
const phoneFrame    = document.getElementById('phone-frame');

// ─────────────────────────────────────────────
// Build sidebar
// ─────────────────────────────────────────────
function buildSidebar() {
  sidebar.innerHTML = '';
  let globalIdx = 0;

  FLOW.forEach((section, si) => {
    const group = document.createElement('div');
    group.className = 'section-group';
    group.dataset.sectionId = section.id;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `
      <div class="section-dot" style="background:${section.color}"></div>
      <div>
        <div class="section-name">${section.label}</div>
      </div>
      <div class="section-count">${section.screens.length}</div>
      <div class="section-chevron">▶</div>
    `;

    const screensDiv = document.createElement('div');
    screensDiv.className = 'section-screens';

    section.screens.forEach((screen, idx) => {
      const num = globalIdx + 1;
      const item = document.createElement('div');
      item.className = 'screen-item';
      item.dataset.idx = globalIdx;
      item.dataset.screenId = screen.id;
      item.title = screen.label;
      item.innerHTML = `
        <span class="screen-num">${num}</span>
        <span class="screen-name">${screen.label}</span>
      `;
      item.addEventListener('click', () => loadScreen(globalIdx));
      screensDiv.appendChild(item);
      globalIdx++;
    });

    hdr.addEventListener('click', () => {
      const isOpen = screensDiv.classList.contains('open');
      screensDiv.classList.toggle('open', !isOpen);
      hdr.querySelector('.section-chevron').classList.toggle('open', !isOpen);
    });

    group.appendChild(hdr);
    group.appendChild(screensDiv);

    if (si < FLOW.length - 1) {
      const div = document.createElement('div');
      div.className = 'section-divider';
      group.appendChild(div);
    }

    sidebar.appendChild(group);
  });

  totalCounter.textContent = `${ALL_SCREENS.length} screens`;
}

// ─────────────────────────────────────────────
// Sync UI to a screen index (no iframe reload)
// ─────────────────────────────────────────────
function syncUI(idx) {
  if (idx < 0 || idx >= ALL_SCREENS.length) return;
  currentIndex = idx;
  const screen = ALL_SCREENS[idx];

  openBtn.href = BASE + screen.id + '/code.html';
  screenTitle.innerHTML = `<strong>${screen.label}</strong> <span style="color:var(--text-muted)">· ${screen.sectionLabel}</span>`;
  flowLabel.textContent = screen.sectionLabel;
  posLabel.textContent = `${idx + 1} / ${ALL_SCREENS.length}`;
  progressFill.style.width = ((idx + 1) / ALL_SCREENS.length * 100) + '%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === ALL_SCREENS.length - 1;

  document.querySelectorAll('.screen-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
  });

  const activeItem = document.querySelector(`.screen-item[data-idx="${idx}"]`);
  if (activeItem) {
    const screensDiv = activeItem.parentElement;
    if (!screensDiv.classList.contains('open')) {
      screensDiv.classList.add('open');
      const hdr = screensDiv.previousElementSibling;
      hdr && hdr.querySelector('.section-chevron').classList.add('open');
    }
    setTimeout(() => activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50);
  }

  history.replaceState(null, '', '#' + screen.id);
}

// Extract screen ID from an iframe src/href string
function screenIdFromUrl(url) {
  if (!url) return null;
  const clean = decodeURIComponent(url).replace(/\\/g, '/');
  const parts = clean.split('/').filter(Boolean);
  // expect .../screen_folder/code.html
  if (parts.length >= 2 && parts[parts.length - 1] === 'code.html') {
    return parts[parts.length - 2];
  }
  return null;
}

// ─────────────────────────────────────────────
// Load screen (from sidebar click or keyboard)
// ─────────────────────────────────────────────
function loadScreen(idx) {
  if (idx < 0 || idx >= ALL_SCREENS.length) return;
  const screen = ALL_SCREENS[idx];
  const path = BASE + screen.id + '/code.html';

  loading.classList.add('visible');
  iframe.src = path;
  syncUI(idx);
}

// ─────────────────────────────────────────────
// Sync sidebar when nav.js navigates the iframe
// ─────────────────────────────────────────────
iframe.addEventListener('load', () => {
  loading.classList.remove('visible');
  try {
    const iframeUrl = iframe.contentWindow && iframe.contentWindow.location.href;
    const screenId = screenIdFromUrl(iframeUrl);
    if (screenId) {
      const idx = ALL_SCREENS.findIndex(s => s.id === screenId);
      if (idx >= 0 && idx !== currentIndex) {
        syncUI(idx);
      }
    }
  } catch (e) {
    // cross-origin guard — ignore
  }
});

// ─────────────────────────────────────────────
// Navigation
// ─────────────────────────────────────────────
prevBtn.addEventListener('click', () => loadScreen(currentIndex - 1));
nextBtn.addEventListener('click', () => loadScreen(currentIndex + 1));

document.addEventListener('keydown', e => {
  if (e.target === searchInput) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    loadScreen(currentIndex + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    loadScreen(currentIndex - 1);
  }
});

// ─────────────────────────────────────────────
// Search
// ─────────────────────────────────────────────
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.section-group').forEach(group => {
    let hasVisible = false;
    group.querySelectorAll('.screen-item').forEach(item => {
      const label = item.querySelector('.screen-name').textContent.toLowerCase();
      const screenId = item.dataset.screenId.toLowerCase();
      const visible = !q || label.includes(q) || screenId.includes(q);
      item.classList.toggle('search-hidden', !visible);
      if (visible) hasVisible = true;
    });
    group.classList.toggle('search-empty', !hasVisible);

    // Auto-expand sections that have results when searching
    if (q && hasVisible) {
      const screensDiv = group.querySelector('.section-screens');
      const chevron = group.querySelector('.section-chevron');
      screensDiv && screensDiv.classList.add('open');
      chevron && chevron.classList.add('open');
    }
  });
});

// Clear search on Escape
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchInput.dispatchEvent(new Event('input'));
    searchInput.blur();
  }
});

// ─────────────────────────────────────────────
// Scale phone to fit viewport height
// ─────────────────────────────────────────────
function scalePhone() {
  const available = document.getElementById('center').clientHeight - 40;
  const phoneH = 844;
  const scale = Math.min(1, available / phoneH);
  scaleWrap.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', scalePhone);

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
buildSidebar();
scalePhone();

// Open first section by default
const firstGroup = document.querySelector('.section-group');
if (firstGroup) {
  const screensDiv = firstGroup.querySelector('.section-screens');
  screensDiv && screensDiv.classList.add('open');
  const chevron = firstGroup.querySelector('.section-chevron');
  chevron && chevron.classList.add('open');
}

// Load from hash or start at first screen
const hash = location.hash.slice(1);
const hashIdx = hash ? ALL_SCREENS.findIndex(s => s.id === hash) : -1;
if (hashIdx >= 0) {
  loadScreen(hashIdx);
} else {
  loadScreen(0);
}
</script>
